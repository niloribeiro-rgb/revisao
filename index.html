<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <link rel="icon" type="image/png" href="assets/pokemon.png">
    <title>revisao</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="assets/pokemonRemove.png" alt="">
        </div>
        <nav>
            <div class="link">
                <a href="#imagesContainer">IMAGENS</a>
                <a href="#videosContainer">DESENHOS</a>
                 <a href="#galeriaContainer">GALERIA</a>
            </div>
        </nav>
        <div class="botao">
            <button onclick="openClosePopUp()">CONTRATE-NOS</button>
            <div class="popUpContainer">
                <div class="popUpTop">
                    <button onclick="openClosePopUp()"><img src="assets/icons/x.svg" alt=""></button>
                </div>
                <h1>FALE CONOSCO</h1>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="assunto">Assunto</label>
                        <input type="text" id="assunto" name="assunto">
                    </div>

                    <div class="form-group">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem"  required style="max-width: 170px; max-height: 100px;  min-width: 170px;
                         min-height: 100px;"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">ENVIAR</button>
                </form>
            </div>
        </div>
    </header>
    <main>
        <div class="banner" style="background-image: url(assets/personagensDoJujutsu.png);">
        </div>
        <div class="videosEImagesContainer" id="imagesContainer">
            <div class="cards" id="imagesCards">
                <img src="assets/jujutsu1tp.png" alt="">
            </div>
            <div class="cards" id="imagesCards">
                <img src="assets/jujutsu2tp.png" alt="">
            </div>
            <div class="cards" id="imagesCards">
                <img src="assets/jujutsu3tp.png" alt="">
            </div>
        </div>
        <div class="videosEImagesContainer" id="videosContainer">
        </div>
        <div class="buttonGaleria">
            <button onclick="todosGaleria()">TODOS</button>
             <button onclick="personagensGaleria()">PERSONAGENS</button>
              <button onclick="montrosGaleria()">MONSTROS</button>
        </div>
        
        <div class="galeriaContainer" id="galeriaContainer"></div>

    </main>
    <footer>
        <div class="linkFooter">
                <a href="#imagesContainer">IMAGENS</a>
                <a href="#videosContainer">DESENHOS</a>
                <a href="#montrosGaleria">GALERIA</a>
            </div>
        <p>2026 &copy revisao</p>
    </footer>
</body>
</html>
